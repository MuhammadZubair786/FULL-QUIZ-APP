<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">



    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #222;
        }

        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background: #1e293b;
            color: white;
            padding: 25px 15px;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 35px;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin-bottom: 8px;
        }

        .menu a {
            display: block;
            text-decoration: none;
            color: #cbd5e1;
            padding: 13px 15px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .menu a:hover,
        .menu .active {
            background: #334155;
            color: white;
        }

        /* Main Content */
        .main {
            margin-left: 240px;
            width: calc(100% - 240px);
            padding: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .topbar h1 {
            font-size: 28px;
        }

        .admin {
            background: white;
            padding: 10px 18px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        /* Cards */
        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            font-size: 15px;
            color: #64748b;
            margin-bottom: 12px;
        }

        .card .number {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .card p {
            font-size: 13px;
            color: #16a34a;
        }

        /* Table */
        .table-box {
            background: white;
            margin-top: 30px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .table-box h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            color: #475569;
            font-size: 14px;
        }

        td {
            font-size: 14px;
        }

        .status {
            background: #dcfce7;
            color: #15803d;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        /* Responsive */
        @media (max-width: 1000px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 700px) {
            .sidebar {
                width: 70px;
                padding: 20px 8px;
            }

            .logo {
                font-size: 16px;
            }

            .menu a {
                font-size: 0;
                text-align: center;
            }

            .menu a::first-letter {
                font-size: 18px;
            }

            .main {
                margin-left: 70px;
                width: calc(100% - 70px);
                padding: 20px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .table-box {
                overflow-x: auto;
            }

            table {
                min-width: 600px;
            }
        }
    </style>
</head>

<body>

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                Admin Panel
            </div>

            <ul class="menu">

                <li>

                <li>
                    <a href="#" class="active">💳 Quizs</a>
                </li>

                <li>
                    <a href="#">📊 Reports</a>
                </li>

                <li>
                    <a href="#">⚙️ Settings</a>
                </li>

                <li>
                    <a href="#">🚪 Logout</a>
                </li>
            </ul>

        </aside>


        <!-- Main Content -->
        <main class="main">

            <!-- Top Bar -->
            <div class="topbar">

                <div>
                    <h1> QUIZ Page
                    </h1>

                </div>

                <div class="admin">
                    👤 Admin
                </div>

            </div>





            <!-- Recent Students -->
            <section class="table-box">
                <div style="text-align: right">
                    <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#staticBackdrop">Add new
                        QUIZ</button>

                </div>


                <h2>QUIZ List</h2>

                <table>

                    <thead>
                        <tr>
                            <th>S.no</th>
                            <th>Course name</th>
                            <th>Quiz name</th>
                            <th>View</th>
                        </tr>
                    </thead>

                    <tbody id="courseTable">

                      

                       


                    </tbody>

                </table>

            </section>

        </main>

    </div>




    <!-- Modal -->
    <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="staticBackdropLabel">Add New Course</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                     <div class="mb-3 row">
                        <label for="courseName" class="col-sm-4 col-form-label">COUSE NAME</label>
                        <div class="col-sm-7">
                            <select type="text" id="courses">
                                <option selected disabled> select course</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label for="courseduration" class="col-sm-4 col-form-label">QUIZ NAME</label>
                        <div class="col-sm-7">
                            <input type="text" class="form-control" id="quizName">
                        </div>
                    </div>
                   
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="addQuiz()">Understood</button>
                </div>
            </div>
        </div>
    </div>
